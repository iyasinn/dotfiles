# ─────────────────────────────────────────────────────────────
# Tmux configuration
# ─────────────────────────────────────────────────────────────

# Plugin manager and plugin list
# Keep runtime plugins outside this dotfiles repository.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Declare plugins before the bootstrap so a first run can install all of them.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'laktak/extrakto'

# Continuum must be the last plugin so its status-right autosave hook survives.
set -g @plugin 'tmux-plugins/tmux-continuum'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Prefix and reload
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Terminal support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",screen-256color:RGB"

# csi-u is available in tmux 3.5 and newer.
if -F "#{>=:#{version},3.5}" {
  set -g extended-keys-format csi-u
}

set -g extended-keys on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Core behavior
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Window names change only when renamed manually with prefix + ,.
setw -g automatic-rename off
set -g allow-rename off

# Silence bells and activity notifications.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Windows and panes
bind c new-window -c "#{pane_current_path}"
bind a last-window
bind C-p previous-window
bind C-n next-window

unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g pane-border-lines single

# Neovim-aware navigation
# Ctrl-h/j/k/l moves; Alt-h/j/k/l resizes. Matching Neovim keymaps are
# expected from smart-splits.nvim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 5"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 5"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 5"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 5"

# Prefix fallbacks and a replacement for the usual Ctrl-l clear screen.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind C-l send-keys 'C-l'

# Copy mode
setw -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Quality of life
# Pane and window kills intentionally skip confirmation.
bind x kill-pane
bind X kill-window
bind = select-layout even-horizontal
bind + select-layout even-vertical

bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

bind S setw synchronize-panes \; \
  display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# Plugin behavior
unbind O
set -g @sessionx-bind 'o'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @extrakto_key 'tab'

# Restore structure and supported programs, but never persist visible pane text.
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Catppuccin 2.x must be loaded before its status modules are composed.
if "test -f ~/.tmux/plugins/tmux/catppuccin.tmux" \
   "run '~/.tmux/plugins/tmux/catppuccin.tmux'"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 120

# Workflow indicators: session | application | directory | date and time.
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# TPM loads every declared plugin. Keep this at the bottom.
run '~/.tmux/plugins/tpm/tpm'
