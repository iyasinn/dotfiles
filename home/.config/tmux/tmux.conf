# ─────────────────────────────────────────────────────────────
#  Tmux Configuration
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
#  Tmux Plugin Manager (TPM, self-installing)
# ─────────────────────────────────────────────────────────────

# Pin the plugin path explicitly. Without this, TPM auto-detects the
# XDG config location (~/.config/tmux) and installs plugins to
# ~/.config/tmux/plugins while TPM itself lives in ~/.tmux/plugins,
# splitting things across two directories.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# ─────────────────────────────────────────────────────────────
#  Prefix
# ─────────────────────────────────────────────────────────────

# Use Ctrl-a as tmux prefix instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ─────────────────────────────────────────────────────────────
#  Terminal / Color
# ─────────────────────────────────────────────────────────────

# Good default for Kitty + truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",screen-256color:RGB"

# csi-u format only exists in tmux >= 3.5; guard so older tmux
# doesn't error on config load
if -F "#{>=:#{version},3.5}" {
  set -g extended-keys-format csi-u
}

# Makes Neovim feel more responsive inside tmux
set -sg escape-time 10

# Let terminal apps receive focus events
set -g focus-events on

# Clipboard integration
set -g set-clipboard on

# ─────────────────────────────────────────────────────────────
#  General Behavior
# ─────────────────────────────────────────────────────────────

set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Keep manually renamed windows stable. Rename with prefix + ,.
# allow-rename off stops apps from overwriting names via escape sequences.
setw -g automatic-rename off
set -g allow-rename off

# Start new windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────
#  Bell / Activity
# ─────────────────────────────────────────────────────────────

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ─────────────────────────────────────────────────────────────
#  Splits
# ─────────────────────────────────────────────────────────────

# Ctrl-a \  => split left/right
# Ctrl-a -  => split top/bottom
unbind '"'
unbind %

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─────────────────────────────────────────────────────────────
#  Smart Splits / Neovim Integration
# ─────────────────────────────────────────────────────────────
#
# Ctrl-h/j/k/l  => move between Neovim splits and tmux panes
# Alt-h/j/k/l   => resize Neovim splits and tmux panes
#
# Requires matching smart-splits.nvim keymaps in Neovim.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Movement: Ctrl-h/j/k/l
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Plain C-l is taken by pane navigation, so give clear-screen a home:
# prefix + C-l
bind C-l send-keys 'C-l'

# Resize: Alt-h/j/k/l
bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 5"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 5"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 5"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 5"

# Fallback prefix movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fallback prefix resize
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ─────────────────────────────────────────────────────────────
#  Windows
# ─────────────────────────────────────────────────────────────

# n / p / 1-9 are tmux defaults and need no rebinding
bind Tab last-window
bind a last-window
bind C-p previous-window
bind C-n next-window

# ─────────────────────────────────────────────────────────────
#  Copy Mode
# ─────────────────────────────────────────────────────────────

setw -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Mouse drag copy behavior
# (use copy-selection-no-clear instead if you don't want the view to
# jump back to the bottom after a mouse copy)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ─────────────────────────────────────────────────────────────
#  Panes
# ─────────────────────────────────────────────────────────────

set -g pane-border-lines single

# ─────────────────────────────────────────────────────────────
#  Status Bar (layout only — styling comes from theme plugin)
# ─────────────────────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 100
set -g status-left ""

# ─────────────────────────────────────────────────────────────
#  Quality of Life
# ─────────────────────────────────────────────────────────────

# Kill pane/window (no confirmation prompt — add confirm-before -p
# "kill-pane? (y/n)" if you want a safety net)
bind x kill-pane
bind X kill-window

# Rebalance panes
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Popups / floating windows
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Toggle pane synchronization
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# Extended keys for modified enter for coding agents
set -g extended-keys on

# ─────────────────────────────────────────────────────────────
#  Plugins: Catppuccin theme
# ─────────────────────────────────────────────────────────────

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# TPM must stay at the very bottom of tmux.conf
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
